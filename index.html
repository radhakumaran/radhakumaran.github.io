<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Radha Kumaran</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --sans: 'Barlow', system-ui, sans-serif;
  --bg:           #f5efeb;
  --surface:      #ede6e1;
  --blue:         #567c8d;
  --blue-dark:    #3d5e6d;
  --blue-light:   #d4e4eb;
  --blue-mid:     #8aaebb;
  --ink:          #2a2520;
  --mid:          #5a5450;
  --muted:        #8a8480;
  --light:        #bbb5b0;
  --border:       #d8d0c8;
  --border-light: #e6e0da;
}

html, body { background: var(--bg); }

body {
  font-family: var(--sans);
  color: var(--ink);
  font-size: 15px;
  line-height: 1.65;
}

a { color: var(--blue-dark); text-decoration: none; }
a:hover { color: var(--blue); text-decoration: underline; }

/* ── PAGE SHELL ── */
.page {
  max-width: 1140px;
  margin: 0 auto;
  background: var(--bg);
  border-left: 1px solid var(--border);
  border-right: 1px solid var(--border);
  min-height: 100vh;
}

/* ── HEADER BAR ── */
.site-header {
  background: var(--blue);
  padding: 1.25rem 2rem;
  display: flex;
  align-items: baseline;
  gap: 1rem;
}
.site-header h1 {
  font-size: 1.6rem;
  font-weight: 400;
  color: #fff;
  letter-spacing: 0.01em;
}
.site-header .subtitle {
  font-size: 13px;
  color: rgba(255,255,255,0.7);
  font-weight: 300;
}

/* ── TOP BAND ── */
.top-band {
  display: grid;
  grid-template-columns: 200px 1fr 280px;
}
.top-col { padding: 1.75rem 1.5rem; }

/* Blue underline heading wrapper used in all three cols */
.col-heading-wrap {
  margin-bottom: 0.85rem;
  padding-bottom: 0.5rem;
  border-bottom: 2px solid var(--blue);
}
.col-heading {
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--blue);
  display: block;
}

/* Headshot */
.headshot-col img {
  width: 100%;
  max-width: 160px;
  display: block;
  margin-bottom: 1rem;
}
.headshot-placeholder {
  width: 100%;
  max-width: 160px;
  aspect-ratio: 1;
  background: var(--surface);
  border: 1px solid var(--border);
  margin-bottom: 1rem;
}
.contact-block {
  font-size: 13px;
  line-height: 1.75;
  color: var(--mid);
}
.contact-block a { color: var(--blue-dark); }

.social-row { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 10px; }
.social-pill {
  font-size: 12px;
  color: var(--blue-dark);
  text-decoration: underline;
  text-transform: lowercase;
}
.social-pill:hover {
  color: var(--blue);
}

/* Bio */
.bio-col p {
  font-size: 14.5px;
  font-weight: 300;
  line-height: 1.8;
  color: var(--ink);
  margin-bottom: 0.75rem;
}
.bio-col p:last-child { margin-bottom: 0; }

/* News */
.news-item {
  padding: 0.55rem 0;
  border-top: 1px solid var(--border-light);
  font-size: 13px;
  line-height: 1.55;
}
.news-item:first-of-type { border-top: none; }
.news-date {
  font-size: 11.5px;
  font-weight: 500;
  color: var(--blue);
  display: block;
  margin-bottom: 2px;
}
.see-all {
  font-size: 12px;
  font-weight: 500;
  color: var(--blue-dark);
  display: inline-block;
  margin-top: 0.75rem;
  border-bottom: 1px solid var(--blue-mid);
  padding-bottom: 1px;
}
.see-all:hover { color: var(--blue); text-decoration: none; border-color: var(--blue); }

/* ── PUBLICATIONS ── */
.pub-section { padding: 2rem; }

.pub-section-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 1.5rem;
  padding-bottom: 0.6rem;
  border-bottom: 2px solid var(--blue);
}
.pub-section-header h2 {
  font-size: 13px;
  font-weight: 600;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--blue);
}
.pub-section-header .see-all { margin-top: 0; }

.pub-list { display: flex; flex-direction: column; }

.pub-item {
  display: grid;
  grid-template-columns: 90px 1fr;
  gap: 14px;
  padding: 1.1rem 0;
  border-top: 1px solid var(--border-light);
}
.pub-item.no-thumb { grid-template-columns: 1fr; }
.pub-item:first-child { border-top: none; }

.pub-thumb-wrap { flex-shrink: 0; }
.pub-thumb {
  width: 100%;
  aspect-ratio: 4/3;
  object-fit: cover;
  display: block;
  background: var(--surface);
  border: 1px solid var(--border);
}
.pub-thumb-placeholder {
  width: 100%;
  aspect-ratio: 4/3;
  background: var(--surface);
  border: 1px solid var(--border);
}

.pub-title {
  font-size: 14px;
  font-weight: 500;
  line-height: 1.45;
  margin-bottom: 4px;
  color: var(--ink);
}
.pub-title a { color: var(--ink); }
.pub-title a:hover { color: var(--blue-dark); }
.award-medal { font-size: 13px; vertical-align: middle; cursor: help; }

.pub-authors { font-size: 12.5px; color: var(--mid); margin-bottom: 2px; line-height: 1.5; }
.pub-venue   { font-size: 12.5px; color: var(--muted); font-style: italic; margin-bottom: 6px; }
.pub-venue .pub-type-tag { margin-left: 12px; }
.pub-links { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; font-size: 12px; }
.pub-links a {
  color: var(--blue-dark);
  text-transform: lowercase;
  text-decoration: underline;
}
.pub-links a:hover { color: var(--blue); }
.pub-type-tag {
  font-size: 11.5px;
  font-weight: 500;
  padding: 0 2px;
  text-transform: none;
}
.tag-conference { background: var(--blue-light); color: var(--blue-dark); }
.tag-journal    { background: #dff0e0; color: #2a5e38; }
.tag-workshop   { background: #f5edd8; color: #7a5500; }
.tag-poster     { background: #ede0f0; color: #5a2e78; }
.loading { color: var(--muted); font-size: 13px; font-style: italic; }

.loading { color: var(--muted); font-size: 13px; font-style: italic; }

/* How many pubs to show on the home page before "see all" link appears */
/* Controlled in JS via PREVIEW_PUBS below */

@media (max-width: 820px) {
  .top-band { grid-template-columns: 1fr 1fr; }
  .news-col { grid-column: 1 / -1; border-top: 1px solid var(--border); }
}
@media (max-width: 560px) {
  .top-band { grid-template-columns: 1fr; }
  .pub-item { grid-template-columns: 70px 1fr; }
  .site-header { flex-direction: column; gap: 0; }
}
</style>
</head>
<body>
<div class="page">

  <header class="site-header">
    <h1 id="site-name">xxx</h1>
    <span class="subtitle" id="site-subtitle">xxx</span>
  </header>

  <div class="top-band">

    <!-- Headshot + contact -->
    <div class="top-col headshot-col">
      <img id="profile-img" src="" alt="Profile photo" style="display:none">
      <div class="headshot-placeholder" id="profile-placeholder"></div>
      <div class="contact-block" id="contact-block">
        <div class="col-heading-wrap"><span class="col-heading">Contact</span></div>
        <span class="loading">Loading…</span>
      </div>
      <div class="social-row" id="social-links"></div>
    </div>

    <!-- Bio -->
    <div class="top-col bio-col" id="about-section">
      <span class="loading">Loading…</span>
    </div>

    <!-- News -->
    <div class="top-col news-col">
      <div class="col-heading-wrap"><span class="col-heading">Recent News</span></div>
      <div id="news-list"><span class="loading">Loading…</span></div>
      <a class="see-all" href="all.html#news" id="news-all-link" style="display:none">See all news →</a>
    </div>

  </div>

  <!-- Publications -->
  <div class="pub-section">
    <div class="pub-section-header">
      <h2>Selected Publications</h2>
      <a class="see-all" href="all.html#publications" id="pub-all-link" style="display:none">See all publications →</a>
    </div>
    <div class="pub-list" id="pub-list">
      <span class="loading">Loading…</span>
    </div>
  </div>

</div>

<script>
// ════════════════════════════════════════════════════
//  CONFIG
// ════════════════════════════════════════════════════
const SHEET_ID = '1vdWkW67AXDcAHkfEshnMCXyBILs_GchqkT7qdLV6NHI';

// Set false to hide all publication thumbnail images
const SHOW_IMAGES = false;

// How many news items to show on the home page (rest go to all.html)
const PREVIEW_NEWS = 5;

// How many publications to show on the home page (rest go to all.html)
const PREVIEW_PUBS = 8;

// ════════════════════════════════════════════════════
//  Sheets fetcher
// ════════════════════════════════════════════════════
async function fetchSheet(tab) {
  const url = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json&headers=1&sheet=${encodeURIComponent(tab)}`;
  const res = await fetch(url);
  if (!res.ok) throw new Error(`Failed: ${tab}`);
  const text = await res.text();
  const json = JSON.parse(text.match(/google\.visualization\.Query\.setResponse\(([\s\S]*?)\);/)[1]);
  const cols = json.table.cols.map(c => c.label.trim());
  return json.table.rows.map(row => {
    const obj = {};
    row.c.forEach((cell, i) => { obj[cols[i]] = cell ? (typeof cell.v === 'string' ? cell.v : (cell.f ?? '')) : ''; });
    return obj;
  });
}

// ════════════════════════════════════════════════════
//  Renderers
// ════════════════════════════════════════════════════
function renderAbout(rows) {
  document.getElementById('about-section').innerHTML =
    rows.map(r => `<p>${r.paragraph || ''}</p>`).join('');
  if (rows[0]?.name) {
    document.getElementById('site-name').textContent = rows[0].name;
    document.title = rows[0].name;
  }
  if (rows[0]?.subtitle)
    document.getElementById('site-subtitle').textContent = rows[0].subtitle;
  if (rows[0]?.photo_url) {
    const img = document.getElementById('profile-img');
    img.src = rows[0].photo_url;
    img.style.display = 'block';
    document.getElementById('profile-placeholder').style.display = 'none';
  }
}

function renderContact(rows) {
  const block = document.getElementById('contact-block');
  if (!rows.length) { block.innerHTML = ''; return; }
  const r = rows[0];
  let html = `<div class="col-heading-wrap"><span class="col-heading">Contact</span></div>`;
  if (r.address)      html += r.address.split('\\n').join('<br>');
  if (r.office_hours) html += `<br>${r.office_hours}`;
  if (r.email)        html += `<br>${r.email}`;
  block.innerHTML = html;
}

function renderSocial(rows) {
  document.getElementById('social-links').innerHTML =
    rows.map(r => `<a class="social-pill" href="${r.url}">${r.label}</a>`).join('');
}

function renderNews(rows) {
  const el = document.getElementById('news-list');
  el.innerHTML = rows.slice(0, PREVIEW_NEWS).map(r =>
    `<div class="news-item">
      <span class="news-date">${r.date || ''}</span>
      ${r.text || ''}
    </div>`
  ).join('');
  if (rows.length > PREVIEW_NEWS)
    document.getElementById('news-all-link').style.display = 'inline-block';
}

const TYPE_CLASS = { conference:'tag-conference', journal:'tag-journal', workshop:'tag-workshop', short:'tag-workshop', abstract:'tag-workshop', poster:'tag-poster' };
const TYPE_LABEL = { conference:'conference', journal:'journal', workshop:'workshop', short:'short paper', abstract:'abstract', poster:'poster' };

function pubItemHTML(r) {
  const type     = (r.type || 'conference').toLowerCase();
  const tagClass = TYPE_CLASS[type] || 'tag-conference';
  const tagLabel = TYPE_LABEL[type] || r.type;
  const titleHtml = r.url ? `<a href="${r.url}">${r.title}</a>` : (r.title || '');
  const thumbHtml = SHOW_IMAGES
    ? `<div class="pub-thumb-wrap">${r.thumb_url
        ? `<img class="pub-thumb" src="${r.thumb_url}" alt="" loading="lazy">`
        : `<div class="pub-thumb pub-thumb-placeholder"></div>`}</div>`
    : '';
  const links = [];
  if (r.pdf_url)   links.push(`<a href="${r.pdf_url}">PDF</a>`);
  if (r.doi_url)   links.push(`<a href="${r.doi_url}">DOI</a>`);
  if (r.video_url) links.push(`<a href="${r.video_url}">Video</a>`);
  if (r.talk_url)  links.push(`<a href="${r.talk_url}">Talk</a>`);
  if (r.bibtex)    links.push(`<a href="data:text/plain;charset=utf-8,${encodeURIComponent(r.bibtex)}" download="citation.bib">BibTeX</a>`);
  const medal = r.award ? `<span class="award-medal" title="${r.award}">🏅</span>` : '';
  const linksRow = `<div class="pub-links">${links.join('')}</div>`;
  return `<div class="pub-item${SHOW_IMAGES ? '' : ' no-thumb'}" data-type="${type}">
    ${thumbHtml}
    <div class="pub-body">
      <div class="pub-title">${titleHtml}${medal ? `&ensp;${medal}` : ''}</div>
      <div class="pub-authors">${r.authors || ''}</div>
      <div class="pub-venue">${r.venue || ''} <span class="pub-type-tag ${tagClass}">${tagLabel}</span></div>
      ${linksRow}
    </div>
  </div>`;
}

function renderPublications(rows) {
  const el = document.getElementById('pub-list');
  const featured = rows.filter(r => r.featured && r.featured.toLowerCase() === 'yes');
  el.innerHTML = featured.map(pubItemHTML).join('');
  if (rows.length > featured.length)
    document.getElementById('pub-all-link').style.display = 'inline-block';
}

// ════════════════════════════════════════════════════
//  Init
// ════════════════════════════════════════════════════
async function init() {
  if (SHEET_ID === 'YOUR_GOOGLE_SHEET_ID_HERE') { demo(); return; }
  const tabs = { about:'about', contact:'contact', social:'social', news:'news', publications:'publications' };
  const results = await Promise.allSettled(
    Object.entries(tabs).map(([k,t]) => fetchSheet(t).then(rows => [k, rows]))
  );
  for (const r of results) {
    if (r.status !== 'fulfilled') { console.warn(r.reason); continue; }
    const [key, rows] = r.value;
    try {
      if (key === 'about')        renderAbout(rows);
      if (key === 'contact')      renderContact(rows);
      if (key === 'social')       renderSocial(rows);
      if (key === 'news')         renderNews(rows);
      if (key === 'publications') renderPublications(rows);
    } catch(e) { console.warn('Render error', key, e); }
  }
}

// ════════════════════════════════════════════════════
//  Demo mode (no Sheet ID set)
// ════════════════════════════════════════════════════
function demo() {
  renderAbout([
    { name:'Your Name', subtitle:'Assistant Professor · Saarland University',
      paragraph:'I am an Assistant Professor in the Department of Computer Science at Saarland University, where I lead the Multimodal Interaction Lab. My research sits at the intersection of augmented reality, human-computer interaction, and AI-powered wearable systems.', photo_url:'' },
    { paragraph:'I design systems that support interaction through gaze, gesture, speech, and touch — and study how multimodal design shapes cognition, presence, and user experience in the wild.' },
  ]);
  renderContact([{ address:'E1.1, Room 123\nSaarland University\n66123 Saarbrücken', office_hours:'Office Hours: Tue 14:00–15:00', email:'you@cs.uni-saarland.de' }]);
  renderSocial([
    { label:'CV', url:'#' }, { label:'Google Scholar', url:'#' },
    { label:'GitHub', url:'#' }, { label:'Mastodon', url:'#' },
  ]);
  renderNews([
    { date:'Jun 2026', text:'Paper accepted at ACM UIST 2026 on adaptive multimodal input for AR headsets.' },
    { date:'Apr 2026', text:'Invited talk at the Dagstuhl Seminar on Augmented Reality Interaction.' },
    { date:'Jan 2026', text:'New DFG project funded: Context-Aware Multimodal Interfaces for Wearable AR.' },
    { date:'Oct 2025', text:'New graduate seminar on Multimodal AR starting this winter semester.' },
    { date:'Sep 2025', text:'Joined the program committee for ACM CHI 2026.' },
    { date:'Jun 2025', text:'Best Paper Award at ACM DIS 2025.' },
    { date:'Mar 2025', text:'Presented at IEEE VR 2025 in Saint-Malo, France.' },
  ]);
  renderPublications([
    { type:'conference', title:'GazePointAR: A Context-Aware Multimodal Voice Assistant for Pronoun Disambiguation in Wearable AR', authors:'Your Name, J. Lee, M. Billinghurst', venue:'ACM CHI 2024', award:'Best Paper Award', pdf_url:'#', doi_url:'#', thumb_url:'' },
    { type:'conference', title:'Adaptive Multimodal Fusion for Real-Time AR Interaction Under Cognitive Load', authors:'Your Name, S. Schmidt', venue:'IEEE ISMAR 2024', pdf_url:'#', doi_url:'#', thumb_url:'' },
    { type:'journal', title:'A Survey of Gaze-Based Interaction Techniques for Augmented Reality Headsets', authors:'Your Name, A. Krüger, T. Müller', venue:'ACM TOCHI, 2023', pdf_url:'#', doi_url:'#', thumb_url:'' },
    { type:'workshop', title:'Toward Unified Modality Evaluation Frameworks for Wearable AR', authors:'Your Name', venue:'Workshop on Evaluation Methods in AR/VR, ACM CHI 2023', pdf_url:'#', thumb_url:'' },
    { type:'poster', title:'Preliminary Results: Eye Tracking for Implicit Intent Recognition in AR', authors:'Your Name, S. Schmidt', venue:'ACM UIST 2022 (Poster)', pdf_url:'#', thumb_url:'' },
    { type:'conference', title:'Speech-Driven Object Selection in AR Using Contextual Language Models', authors:'Your Name, T. Müller', venue:'ACM CHI 2022', pdf_url:'#', doi_url:'#', thumb_url:'' },
  ]);
}

init();
</script>
</body>
</html>
